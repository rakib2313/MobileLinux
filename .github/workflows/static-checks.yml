# Static checks only. These run on a GitHub-hosted Linux runner. They do NOT run Termux, PRoot,
# Android, XFCE or VNC, so a green check does not prove the project works on a phone.
name: Static checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax check
        run: |
          set -eu
          find scripts -type f \( -name '*.sh' -o -name 'mobilelinux-chromium' \) -print0 | xargs -0 -n1 bash -n
          sh -n configs/vnc/xstartup
      - name: ShellCheck
        run: |
          set -eu
          find scripts -type f \( -name '*.sh' -o -name 'mobilelinux-chromium' \) -print0 | xargs -0 shellcheck -x -S warning
          shellcheck -s sh configs/vnc/xstartup
      - name: Scripts are executable in git
        run: |
          set -eu
          bad=0
          for f in $(git ls-files 'scripts/*.sh' 'scripts/guest/*' configs/vnc/xstartup); do
            case "$(git ls-files -s "$f" | cut -c1-6)" in 100755) ;; *) echo "not executable: $f"; bad=1 ;; esac
          done
          exit "$bad"
      - name: No obvious secrets committed
        run: |
          set -eu
          if git ls-files | grep -E '(^|/)(\.env|ai\.env|config\.env|passwd)$'; then echo "secret-like file tracked"; exit 1; fi
