# MobileLinux Chromium flags: one flag per line, '#' starts a comment.
# Read by scripts/guest/mobilelinux-chromium (user copy: ~/.config/mobilelinux/chromium-flags.conf,
# system copy: /etc/mobilelinux/chromium-flags.conf).
# Only conservative flags are listed. Nothing here disables browser security.
# NOTE: --no-sandbox is deliberately NOT here; see README "Browsers" and SECURITY.md.

# /dev/shm is often small or missing under PRoot; use /tmp for shared memory instead.
--disable-dev-shm-usage
# No GPU is exposed to the guest; avoid GPU initialisation errors.
--disable-gpu

# Optional (uncomment to try on low-memory devices):
# --renderer-process-limit=2
