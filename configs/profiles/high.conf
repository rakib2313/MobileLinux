# MobileLinux profile: high  (key=value, no shell code; read by scripts/lib/common.sh)
# For high-end devices. Higher resolution costs more CPU and bandwidth; no performance is guaranteed.
PROFILE_DESCRIPTION="High: 1920x1080, more desktop conveniences, window compositing on"
PROFILE_GEOMETRY=1920x1080
PROFILE_DEPTH=24
PROFILE_COMPOSITING=true
PROFILE_BROWSER=chromium
PROFILE_EXTRA_PACKAGES="xfce4-screenshooter xfce4-taskmanager xfce4-clipman ristretto"
